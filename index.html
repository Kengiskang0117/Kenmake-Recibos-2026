<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recibos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
/* Herramienta a la izquierda (o arriba en celular), recibo a la derecha (o abajo) */
:root{
  --navy:#0D0F1C; --navy2:#1B1F3D; --lima:#C5F23A; --lima-osc:#3E6B00;
  --papel:#FFFFFF; --fondo:#ECEEF5; --linea:#DDE0EC; --texto:#13152A; --suave:#5A6080;
  --display:'Bebas Neue',Impact,sans-serif; --cuerpo:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:var(--cuerpo);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:1fr}.acciones{position:static}}
.panel{background:#fff;border-radius:18px;padding:18px;border:1px solid var(--linea)}
.panel h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.03em;margin:0 0 2px}
.panel h1 span{background:var(--lima);padding:0 6px;border-radius:4px}
.panel .sub{margin:0 0 14px;color:var(--suave);font-size:13px}
.grupo{border-top:1px solid var(--linea);padding-top:12px;margin-top:12px;display:grid;gap:10px}
.grupo > b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}
.fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:12.5px;font-weight:700;color:var(--suave)}
input,select,textarea{width:100%;min-width:0;height:42px;border:1.5px solid var(--linea);border-radius:10px;padding:0 11px;background:#fff;font-size:15px;font-weight:500;color:var(--texto)}
textarea{height:64px;padding:9px 11px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy2);box-shadow:0 0 0 3px rgba(197,242,58,.55)}
.item{display:grid;grid-template-columns:minmax(0,1fr) 110px 36px;gap:6px;align-items:end}
.quitar{height:42px;border:1.5px solid var(--linea);border-radius:10px;background:#fff;font-weight:700;color:#B3261E}
.agregar{height:40px;border:1.5px dashed var(--navy2);border-radius:10px;background:#F7F8FC;font-weight:700;font-size:13px}
.categorias{display:flex;flex-wrap:wrap;gap:6px}
.categorias button{height:36px;padding:0 12px;border-radius:10px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-size:12.5px;font-weight:800;cursor:pointer}
.categorias button[aria-pressed="true"]{background:var(--navy);color:var(--lima)}
.rapidos small{font-size:11px;font-weight:500;color:var(--suave);margin-left:3px}
.rapidos{display:flex;flex-wrap:wrap;gap:6px}
.rapidos button{height:32px;padding:0 10px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;font-size:12px;font-weight:700}
.rapidos button:hover{border-color:var(--navy2)}
.acciones{position:sticky;bottom:0;background:#fff;padding-top:12px;margin-top:14px;display:grid;gap:8px;border-top:1px solid var(--linea)}
.btn{height:48px;border-radius:999px;border:none;font-weight:800;font-size:15px;cursor:pointer}
.btn.prin{background:var(--navy);color:var(--lima)}
.btn.sec{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}
.btn:disabled{opacity:.5}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.aviso{font-size:12.5px;color:var(--suave);text-align:center;min-height:18px}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}

/* ---------- El recibo ---------- */
.marco{display:flex;justify-content:center}
.recibo{width:100%;max-width:640px;background:var(--papel);border-radius:6px;overflow:hidden;box-shadow:0 20px 50px rgba(13,15,28,.18);font-family:var(--cuerpo);color:var(--texto)}
.r-cab{background:var(--navy);padding:22px 26px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}
.r-cab img{height:44px;width:auto;max-width:240px;object-fit:contain;display:block}
.r-nombre{font-family:var(--display);font-size:30px;letter-spacing:.04em;color:#F4F5FA;line-height:1}
.r-tit{text-align:right}
.r-tit b{display:block;font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.05em;color:#F4F5FA;line-height:1}
.r-tit span{display:block;color:var(--lima);font-weight:800;font-size:13px;letter-spacing:.06em;margin-top:4px;font-variant-numeric:tabular-nums}
.r-franja{height:6px;background:var(--lima)}
.r-cuerpo{padding:20px 26px 6px}
.r-datos{display:grid;grid-template-columns:1fr auto;gap:14px;padding-bottom:14px;border-bottom:1.5px dashed var(--linea)}
.r-et{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--suave)}
.r-val{font-size:16px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.r-val small{display:block;font-weight:500;font-size:13px;color:var(--suave)}
.r-tabla{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
.r-tabla th{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);text-align:left;padding:6px 0;border-bottom:1.5px solid var(--texto)}
.r-tabla th:last-child,.r-tabla td:last-child{text-align:right}
.r-tabla td{padding:9px 0;border-bottom:1px solid var(--linea);font-size:14.5px;vertical-align:top}
.r-tabla td:first-child{padding-right:14px;overflow-wrap:anywhere}
.r-sumas{margin:12px 0 0 auto;max-width:320px;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.r-sumas div{display:flex;justify-content:space-between;gap:16px;font-size:14px}
.r-sumas .este{background:var(--navy);color:#F4F5FA;border-radius:10px;padding:11px 14px;align-items:center}
.r-sumas .este b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--lima);letter-spacing:.02em;line-height:1}
.r-sumas .saldo b{color:#B3261E}
.r-sumas .saldo.cero b{color:var(--lima-osc)}
.r-pago{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;padding-top:12px;border-top:1.5px dashed var(--linea);font-size:13.5px}
.r-pago span b{font-weight:800}
.r-nota{margin-top:10px;font-size:13px;color:var(--suave);overflow-wrap:anywhere}
.r-firma{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:22px;padding-bottom:18px}
.r-firma .linea{border-top:1.5px solid var(--texto);padding-top:4px;min-width:190px;font-size:12.5px;color:var(--suave)}
.r-firma .linea b{display:block;color:var(--texto);font-size:14px}
/* Sello rojo transparente con el logo. Para hacerlo más fuerte o más suave cambia opacity (0 a 1) */
.sello-logo{display:block;width:84px;height:84px;margin-top:10px;opacity:.45;transform:rotate(-13deg);pointer-events:none}
.sello{border:2.5px solid var(--lima-osc);color:var(--lima-osc);border-radius:10px;padding:6px 12px;font-family:var(--display);font-size:22px;letter-spacing:.06em;transform:rotate(-6deg);line-height:1}
.r-pie{background:var(--navy);color:#C9CCDA;padding:12px 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:12.5px}
.r-pie b{color:var(--lima)}
@media (max-width:480px){
  .r-cab,.r-cuerpo,.r-pie{padding-left:16px;padding-right:16px}
  .r-cab img{height:32px}
  .r-tit b{font-size:24px}
  .r-datos{grid-template-columns:1fr}
  .sello-logo{width:72px;height:72px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Lo que llenas ===== -->
  <section class="panel" aria-label="Datos del recibo">
    <h1>RECIBOS <span id="t-nombre"></span></h1>
    <p class="sub">Llena los datos y el recibo se arma solo. Después descárgalo como imagen y mándaselo al cliente por WhatsApp.</p>

    <div class="grupo">
      <b>Recibo</b>
      <div class="fila">
        <label for="f-num">Número<input id="f-num" inputmode="numeric"></label>
        <label for="f-fecha">Fecha<input id="f-fecha" type="date"></label>
      </div>
    </div>

    <div class="grupo">
      <b>Cliente</b>
      <label for="f-cliente">Nombre o negocio<input id="f-cliente" placeholder="Ej.: Black Burger · Alexis"></label>
      <label for="f-tel">Teléfono (opcional)<input id="f-tel" inputmode="tel" placeholder="Ej.: 809-555-1234"></label>
    </div>

    <div class="grupo">
      <b>Trabajo</b>
      <div class="categorias" id="categorias" aria-label="Categorías de servicios"></div>
      <div class="rapidos" id="rapidos" aria-label="Agregar un servicio de la lista de precios"></div>
      <div id="items" style="display:grid;gap:8px"></div>
      <button class="agregar" id="agregar" type="button">+ Agregar otra línea</button>
    </div>

    <div class="grupo">
      <b>Este pago</b>
      <label for="f-tipo">Tipo de pago
        <select id="f-tipo">
          <option value="anticipo">Anticipo (50%)</option>
          <option value="final">Pago final (50%)</option>
          <option value="cuota">Cuota (pago por partes)</option>
          <option value="completo">Pago completo</option>
          <option value="mensualidad">Mensualidad</option>
          <option value="otro">Otro monto</option>
        </select>
      </label>
      <div class="fila">
        <label for="f-monto">Monto recibido (RD$)<input id="f-monto" inputmode="decimal"></label>
        <label for="f-antes">Pagado antes (RD$)<input id="f-antes" inputmode="decimal" placeholder="0"></label>
      </div>
      <div class="fila">
        <label for="f-metodo">Método
          <select id="f-metodo"><option>Transferencia</option><option>Efectivo</option><option>Depósito</option><option>Tarjeta</option></select>
        </label>
        <label for="f-ref">Referencia (opcional)<input id="f-ref" placeholder="Ej.: Banreservas 4521"></label>
      </div>
      <label for="f-nota">Nota (opcional)<textarea id="f-nota" placeholder="Ej.: Entrega estimada: 15 de noviembre."></textarea></label>
    </div>

    <div class="acciones">
      <button class="btn prin" id="descargar" type="button">Descargar imagen del recibo</button>
      <div class="dos">
        <button class="btn sec" id="compartir" type="button">Compartir</button>
        <button class="btn sec" id="nuevo" type="button">Nuevo recibo</button>
      </div>
      <div class="aviso" id="aviso" role="status"></div>
    </div>
  </section>

  <!-- ===== El recibo ===== -->
  <div class="marco">
    <article class="recibo" id="recibo" aria-label="Vista del recibo">
      <div class="r-cab">
        <div id="r-marca"></div>
        <div class="r-tit"><b>RECIBO DE PAGO</b><span id="r-num"></span></div>
      </div>
      <div class="r-franja"></div>
      <div class="r-cuerpo">
        <div class="r-datos">
          <div><div class="r-et">Recibido de</div><div class="r-val" id="r-cliente"></div></div>
          <div><div class="r-et">Fecha</div><div class="r-val" id="r-fecha"></div></div>
        </div>
        <table class="r-tabla">
          <thead><tr><th>Concepto</th><th>Importe</th></tr></thead>
          <tbody id="r-items"></tbody>
        </table>
        <div class="r-sumas">
          <div><span>Total del trabajo</span><b id="r-total"></b></div>
          <div id="r-antes-fila"><span>Pagado antes</span><b id="r-antes"></b></div>
          <div class="este"><span id="r-tipo"></span><b id="r-monto"></b></div>
          <div class="saldo" id="r-saldo-fila"><span>Saldo pendiente</span><b id="r-saldo"></b></div>
        </div>
        <div class="r-pago">
          <span>Método: <b id="r-metodo"></b></span>
          <span id="r-ref-caja">Referencia: <b id="r-ref"></b></span>
        </div>
        <div class="r-nota" id="r-nota"></div>
        <div class="r-firma">
          <div class="linea"><b id="r-firma"></b><span id="r-firma-neg"></span><img class="sello-logo" id="r-sello-logo" alt="" hidden></div>
          <div class="sello" id="r-sello">PAGADO</div>
        </div>
      </div>
      <div class="r-pie"><span><b id="r-pie-nombre"></b><span id="r-pie-lema"></span></span><span id="r-pie-contacto"></span></div>
    </article>
  </div>
</div>

<script>
/* =========================================================
   @@NEGOCIO — Datos del negocio que hace los recibos.
   Para un cliente nuevo: copia esta carpeta, cambia esto y sube su logo.
   ========================================================= */
const NEGOCIO = {
  nombre: "Kenmake Soluciones",
  lema: "Menús digitales y videos",                   // Frase corta que sale abajo del recibo
  firma: "Kengis Florentino",                 // Quién firma los recibos
  contacto: "WhatsApp (849) 884-6470",           // Sale abajo a la derecha
  logo: "logo.png",                   // Archivo del logo en esta misma carpeta (ej.: "logo.png"). Vacío = sale el nombre en letras
  sello: SELLO_LOGO,                  // Sello rojo transparente del recibo (está en el script de arriba). Vacío ("") = sin sello
  prefijo: "KS-",             // Recibo KS-0001, KS-0002…
  colores: { principal: "#0D0F1C", acento: "#C5F23A" }   // principal = fondo oscuro · acento = color llamativo (debe leerse bien sobre el principal)
};

/* @@SERVICIOS — Categorías y paquetes con su precio. Para agregar uno: ["Nombre", precio] dentro de su categoría */
const CATEGORIAS = [
  { nombre: "Combos", servicios: [
    ["Combo Arranque", 14500], ["Combo Negocio", 27500], ["Combo Restaurante", 39500], ["Combo Marca Completa", 42500]
  ]},
  { nombre: "Menú digital", servicios: [
    ["Menú Básico", 12000], ["Menú Completo", 25000], ["Pedidos por mesa", 15000], ["QR impresos", 3500]
  ]},
  { nombre: "Página web", servicios: [
    ["Página web", 20000], ["Web con pedidos y panel de cocina", 40000], ["Sección extra (web)", 3000]
  ]},
  { nombre: "Video", servicios: [
    ["Edición de video corto", 1500], ["Video promocional", 5000], ["Paquete 4 videos al mes", 5000]
  ]},
  { nombre: "Mensual y anual", servicios: [
    ["Mantenimiento mensual", 3500], ["Mantenimiento web con pedidos", 2500], ["Dominio anual", 1000]
  ]}
];
const SERVICIOS = CATEGORIAS.flatMap(c => c.servicios);   // Lista completa (el recibo de ejemplo usa el primero)
const PREFIJO = NEGOCIO.prefijo;
const CLAVE = "recibos-" + NEGOCIO.nombre;   // cada negocio guarda lo suyo aparte

/* Aplica marca, colores y textos */
document.documentElement.style.setProperty("--navy", NEGOCIO.colores.principal);
document.documentElement.style.setProperty("--lima", NEGOCIO.colores.acento);
document.title = "Recibos · " + NEGOCIO.nombre;
document.getElementById("t-nombre").textContent = NEGOCIO.nombre.toUpperCase();
(function marca(){
  const caja = document.getElementById("r-marca");
  const texto = () => { caja.innerHTML = ""; const d = document.createElement("div"); d.className = "r-nombre"; d.textContent = NEGOCIO.nombre.toUpperCase(); caja.append(d); };
  if (!NEGOCIO.logo) return texto();
  const img = new Image(); img.alt = NEGOCIO.nombre; img.onerror = texto; img.src = NEGOCIO.logo; caja.append(img);
})();
if (NEGOCIO.sello) { const s = document.getElementById("r-sello-logo"); s.src = NEGOCIO.sello; s.hidden = false; }
document.getElementById("r-firma").textContent = NEGOCIO.firma;
document.getElementById("r-firma-neg").textContent = NEGOCIO.nombre;
document.getElementById("r-pie-nombre").textContent = NEGOCIO.nombre;
document.getElementById("r-pie-lema").textContent = NEGOCIO.lema ? " · " + NEGOCIO.lema : "";
document.getElementById("r-pie-contacto").textContent = NEGOCIO.contacto;

const $ = s => document.querySelector(s);
const dinero = n => "RD$ " + (Math.round((+n || 0) * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const num = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g, "")); return isNaN(n) ? 0 : n; };
const guardarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const leerLS = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch(e) { return d; } };
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };

let items = [];
let montoEditado = false;

/* ---------- Líneas del trabajo ---------- */
function pintarItems(){
  $("#items").innerHTML = items.map((it, i) => `
    <div class="item">
      <label for="it-d-${i}">Concepto<input id="it-d-${i}" data-i="${i}" data-k="d" value="${it.d.replace(/"/g, "&quot;")}" placeholder="Ej.: Menú Completo"></label>
      <label for="it-p-${i}">Precio<input id="it-p-${i}" data-i="${i}" data-k="p" inputmode="decimal" value="${it.p || ""}" placeholder="0"></label>
      <button class="quitar" type="button" data-quitar="${i}" aria-label="Quitar línea">×</button>
    </div>`).join("");
}
$("#items").addEventListener("input", e => {
  const el = e.target; if (!el.dataset.k) return;
  const it = items[+el.dataset.i]; if (el.dataset.k === "d") it.d = el.value; else it.p = num(el.value);
  actualizar();
});
$("#items").addEventListener("click", e => {
  const b = e.target.closest("[data-quitar]"); if (!b) return;
  items.splice(+b.dataset.quitar, 1); if (!items.length) items.push({ d: "", p: 0 });
  pintarItems(); actualizar();
});
$("#agregar").addEventListener("click", () => { items.push({ d: "", p: 0 }); pintarItems(); actualizar(); $(`#it-d-${items.length - 1}`).focus(); });
let catActiva = 0;
function pintarServicios(){
  $("#categorias").innerHTML = CATEGORIAS.map((c, i) => `<button type="button" data-c="${i}" aria-pressed="${i === catActiva}">${c.nombre}</button>`).join("");
  $("#rapidos").innerHTML = CATEGORIAS[catActiva].servicios.map(([n, p], i) => `<button type="button" data-s="${i}">${n}<small>${dinero(p)}</small></button>`).join("");
}
$("#categorias").addEventListener("click", e => {
  const b = e.target.closest("[data-c]"); if (!b) return;
  catActiva = +b.dataset.c; pintarServicios();
});
$("#rapidos").addEventListener("click", e => {
  const b = e.target.closest("[data-s]"); if (!b) return;
  const [d, p] = CATEGORIAS[catActiva].servicios[+b.dataset.s];
  const vacia = items.findIndex(it => !it.d && !it.p);
  if (vacia >= 0) items[vacia] = { d, p }; else items.push({ d, p });
  pintarItems(); actualizar();
});
pintarServicios();

/* ---------- Cálculos ---------- */
const total = () => items.reduce((a, it) => a + (+it.p || 0), 0);
function montoSugerido(){
  const t = total(), tipo = $("#f-tipo").value;
  if (tipo === "anticipo" || tipo === "final") return Math.round(t / 2);
  if (tipo === "completo" || tipo === "mensualidad") return t;
  return num($("#f-monto").value);
}
$("#f-tipo").addEventListener("change", () => {
  montoEditado = false;
  if ($("#f-tipo").value === "final" && !num($("#f-antes").value)) $("#f-antes").value = Math.round(total() / 2);
  if ($("#f-tipo").value !== "final") $("#f-antes").value = "";
  actualizar();
});
$("#f-monto").addEventListener("input", () => { montoEditado = true; });

const NOMBRE_TIPO = { anticipo:"Anticipo recibido (50%)", final:"Pago final recibido", cuota:"Cuota recibida", completo:"Pago recibido", mensualidad:"Mensualidad recibida", otro:"Monto recibido" };

function actualizar(){
  if (!montoEditado && !["otro","cuota"].includes($("#f-tipo").value)) $("#f-monto").value = montoSugerido() || "";
  const t = total(), monto = num($("#f-monto").value), antes = num($("#f-antes").value);
  const saldo = Math.max(0, t - antes - monto);
  const n = String(num($("#f-num").value) || 1).padStart(4, "0");
  $("#r-num").textContent = "N.º " + PREFIJO + n;
  const f = $("#f-fecha").value ? new Date($("#f-fecha").value + "T12:00") : new Date();
  $("#r-fecha").textContent = f.toLocaleDateString("es-DO", { day:"numeric", month:"long", year:"numeric" });
  const cli = $("#f-cliente").value.trim(), tel = $("#f-tel").value.trim();
  $("#r-cliente").innerHTML = "";
  $("#r-cliente").append(cli || "Nombre del cliente");
  if (tel) { const s = document.createElement("small"); s.textContent = tel; $("#r-cliente").append(s); }
  const filas = items.filter(it => it.d || it.p);
  $("#r-items").innerHTML = "";
  (filas.length ? filas : [{ d: "Concepto del trabajo", p: 0 }]).forEach(it => {
    const tr = document.createElement("tr");
    const a = document.createElement("td"); a.textContent = it.d || "—";
    const b = document.createElement("td"); b.textContent = dinero(it.p);
    tr.append(a, b); $("#r-items").append(tr);
  });
  $("#r-total").textContent = dinero(t);
  $("#r-antes-fila").hidden = !antes; $("#r-antes").textContent = dinero(antes);
  $("#r-tipo").textContent = NOMBRE_TIPO[$("#f-tipo").value];
  $("#r-monto").textContent = dinero(monto);
  const esMensual = $("#f-tipo").value === "mensualidad";
  $("#r-saldo-fila").hidden = esMensual;
  $("#r-saldo-fila").classList.toggle("cero", saldo === 0);
  $("#r-saldo").textContent = saldo === 0 ? "RD$ 0 · Saldado" : dinero(saldo);
  $("#r-sello").textContent = esMensual || saldo === 0 ? "PAGADO" : "ABONO";
  $("#r-metodo").textContent = $("#f-metodo").value;
  const ref = $("#f-ref").value.trim(); $("#r-ref-caja").hidden = !ref; $("#r-ref").textContent = ref;
  $("#r-nota").textContent = $("#f-nota").value.trim();
  guardarBorrador();
}
["#f-num","#f-fecha","#f-cliente","#f-tel","#f-monto","#f-antes","#f-metodo","#f-ref","#f-nota"].forEach(s => $(s).addEventListener("input", actualizar));
$("#f-metodo").addEventListener("change", actualizar);

/* ---------- Borrador y numeración (se guardan en este navegador) ---------- */
function guardarBorrador(){
  guardarLS(CLAVE + "-borrador", {
    num: $("#f-num").value, fecha: $("#f-fecha").value, cliente: $("#f-cliente").value, tel: $("#f-tel").value,
    items, tipo: $("#f-tipo").value, monto: $("#f-monto").value, montoEditado, antes: $("#f-antes").value,
    metodo: $("#f-metodo").value, ref: $("#f-ref").value, nota: $("#f-nota").value
  });
}
function cargar(){
  const b = leerLS(CLAVE + "-borrador", null);
  const sig = leerLS(CLAVE + "-siguiente", 1);
  if (b) {
    $("#f-num").value = b.num || sig; $("#f-fecha").value = b.fecha || hoyISO(); $("#f-cliente").value = b.cliente || ""; $("#f-tel").value = b.tel || "";
    items = Array.isArray(b.items) && b.items.length ? b.items : [{ d: "", p: 0 }];
    $("#f-tipo").value = b.tipo || "anticipo"; $("#f-monto").value = b.monto || ""; montoEditado = !!b.montoEditado; $("#f-antes").value = b.antes || "";
    $("#f-metodo").value = b.metodo || "Transferencia"; $("#f-ref").value = b.ref || ""; $("#f-nota").value = b.nota || "";
  } else {
    // Ejemplo para ver cómo queda: cámbialo por los datos reales
    $("#f-num").value = sig; $("#f-fecha").value = hoyISO();
    $("#f-cliente").value = "Cliente de ejemplo"; items = [{ d: SERVICIOS[0][0], p: SERVICIOS[0][1] }];
    $("#f-tipo").value = "anticipo"; $("#f-metodo").value = "Transferencia";
    $("#f-nota").value = "Entrega estimada: 10 días después de recibir logo, fotos y precios.";
  }
  pintarItems(); actualizar();
}
$("#nuevo").addEventListener("click", () => {
  const usado = num($("#f-num").value) || 1;
  const sig = Math.max(leerLS(CLAVE + "-siguiente", 1), usado + 1);
  guardarLS(CLAVE + "-siguiente", sig);
  $("#f-num").value = sig; $("#f-fecha").value = hoyISO();
  ["#f-cliente","#f-tel","#f-monto","#f-antes","#f-ref","#f-nota"].forEach(s => $(s).value = "");
  $("#f-tipo").value = "anticipo"; montoEditado = false; items = [{ d: "", p: 0 }];
  pintarItems(); actualizar(); avisar(`Recibo ${PREFIJO}${String(sig).padStart(4, "0")} listo para llenar`);
  $("#f-cliente").focus();
});

/* ---------- Imagen del recibo ---------- */
let tAviso;
function avisar(t){ $("#aviso").textContent = t; clearTimeout(tAviso); tAviso = setTimeout(() => $("#aviso").textContent = "", 3500); }
function nombreArchivo(){
  const n = String(num($("#f-num").value) || 1).padStart(4, "0");
  const c = $("#f-cliente").value.trim().toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 30);
  return `recibo-${PREFIJO}${n}${c ? "-" + c : ""}.png`;
}
async function imagen(){
  if (!window.html2canvas) throw new Error("sin librería");
  await document.fonts.ready;
  /* La imagen sale siempre igual, desde celular o computadora:
     el recibo a 600 px de ancho, con 48 px de margen y sombra suave alrededor */
  const ANCHO = 600, MARGEN = 48, ESCALA = 2;
  const rec = await html2canvas($("#recibo"), {
    scale: ESCALA, backgroundColor: null, useCORS: true,
    windowWidth: 1100,                       // usa el diseño de computadora aunque estés en el celular
    onclone: doc => { const r = doc.getElementById("recibo"); r.style.width = ANCHO + "px"; r.style.maxWidth = ANCHO + "px"; r.style.boxShadow = "none"; }
  });
  const m = MARGEN * ESCALA;
  const lienzo = document.createElement("canvas");
  lienzo.width = rec.width + m * 2; lienzo.height = rec.height + m * 2;
  const ctx = lienzo.getContext("2d");
  ctx.fillStyle = "#ECEEF5"; ctx.fillRect(0, 0, lienzo.width, lienzo.height);   // fondo gris claro del margen
  ctx.shadowColor = "rgba(13,15,28,.22)"; ctx.shadowBlur = 24 * ESCALA; ctx.shadowOffsetY = 8 * ESCALA;
  ctx.drawImage(rec, m, m);
  return new Promise(r => lienzo.toBlob(r, "image/png"));
}
function marcarUsado(){
  const usado = num($("#f-num").value) || 1;
  guardarLS(CLAVE + "-siguiente", Math.max(leerLS(CLAVE + "-siguiente", 1), usado + 1));
}
$("#descargar").addEventListener("click", async () => {
  const b = $("#descargar"); b.disabled = true; b.textContent = "Preparando…";
  try {
    const blob = await imagen();
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nombreArchivo();
    document.body.appendChild(a); a.click(); a.remove();
    marcarUsado(); avisar("Imagen descargada. Ya puedes enviarla por WhatsApp.");
  } catch(e) { avisar("No se pudo crear la imagen. Revisa tu conexión a internet y vuelve a intentarlo, o toma una captura del recibo."); }
  b.disabled = false; b.textContent = "Descargar imagen del recibo";
});
$("#compartir").addEventListener("click", async () => {
  try {
    const blob = await imagen();
    const file = new File([blob], nombreArchivo(), { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Recibo " + NEGOCIO.nombre });
      marcarUsado();
    } else avisar("Este navegador no puede compartir directo. Usa «Descargar imagen» y envíala por WhatsApp.");
  } catch(e) { if (e.name !== "AbortError") avisar("No se pudo compartir. Usa «Descargar imagen»."); }
});

cargar();
</script>
